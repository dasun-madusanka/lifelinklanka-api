version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: lifelinklanka-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: YOUR_DB_PASSWORD
      MYSQL_DATABASE: lifelinklanka
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: